<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Car Care">
<meta name="theme-color" content="#1C1C1E">
<title>Car Care</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0A84FF;--blue-lt:rgba(10,132,255,.15);
  --green:#30D158;--green-lt:rgba(48,209,88,.15);
  --amber:#FF9F0A;--amber-lt:rgba(255,159,10,.15);
  --red:#FF453A;--red-lt:rgba(255,69,58,.15);
  --gray-lt:rgba(120,120,128,.12);
  --glass:rgba(255,255,255,.72);--glass-dk:rgba(28,28,30,.82);
  --gb:rgba(255,255,255,.45);--gb2:rgba(255,255,255,.1);
  --blur:saturate(180%) blur(20px);
  --bg:linear-gradient(160deg,#E8F4FF 0%,#F0EBF8 50%,#E6F7F0 100%);
  --text:#1C1C1E;--muted:#636366;--hint:#AEAEB2;
  --r:16px;--rs:12px;--rx:10px;
  --sh:0 2px 8px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){
  :root{
    --glass:rgba(44,44,46,.82);--gb:rgba(255,255,255,.1);
    --bg:linear-gradient(160deg,#0D1B2A 0%,#1A0D2E 50%,#0A1F17 100%);
    --text:#F2F2F7;--muted:#AEAEB2;--hint:#636366;
    --blue-lt:rgba(10,132,255,.2);--green-lt:rgba(48,209,88,.2);
    --amber-lt:rgba(255,159,10,.2);--red-lt:rgba(255,69,58,.2);--gray-lt:rgba(120,120,128,.18);
  }
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;}

/* AUTH */
.aw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.ac{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:24px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.12);}
.a-logo{font-size:48px;text-align:center;margin-bottom:6px;}
.a-title{font-size:26px;font-weight:700;text-align:center;letter-spacing:-.5px;margin-bottom:4px;}
.a-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;}
.a-tabs{display:flex;background:var(--gray-lt);border-radius:var(--rx);padding:3px;margin-bottom:20px;}
.a-tab{flex:1;padding:8px;text-align:center;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .2s;}
.a-tab.active{background:var(--glass);color:var(--text);box-shadow:var(--sh);}
.a-field{margin-bottom:14px;}
.a-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:block;}
.a-input{width:100%;padding:13px 14px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.5);color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none;}
.a-input:focus{outline:none;border-color:var(--blue);}
.a-btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:var(--rx);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;box-shadow:0 4px 16px rgba(10,132,255,.4);}
.a-btn:active{opacity:.85;}
.a-btn:disabled{opacity:.5;cursor:not-allowed;}
.a-msg{font-size:13px;text-align:center;margin-top:10px;min-height:18px;padding:0 4px;line-height:1.4;}
.a-msg.err{color:var(--red);}
.a-msg.ok{color:var(--green);}

/* LAYOUT */
.app{display:none;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;}
.app.on{display:flex;}
.hdr{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:0.5px solid var(--gb);padding:max(52px,env(safe-area-inset-top)) 20px 10px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;}
.hdr-title{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1;}
.hdr-sub{font-size:13px;color:var(--muted);}
.ubadge{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--blue-lt);color:var(--blue);cursor:pointer;white-space:nowrap;border:none;font-family:inherit;}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 110px;}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:0.5px solid var(--gb);display:flex;padding:10px 8px max(24px,env(safe-area-inset-bottom));z-index:100;gap:4px;}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;cursor:pointer;border:none;background:none;color:var(--hint);transition:all .2s cubic-bezier(.34,1.56,.64,1);border-radius:var(--rx);}
.ti.on{color:var(--blue);}
.ti.on .tiw{background:var(--blue-lt);transform:scale(1.08);}
.tiw{width:44px;height:28px;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);border-radius:var(--rx);}
.tic{font-size:20px;line-height:1;}
.til{font-size:10px;font-weight:500;}

/* CAR PILLS */
.cpills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.cpills::-webkit-scrollbar{display:none;}
.cpill{padding:6px 14px;border-radius:20px;border:0.5px solid var(--gb);background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0;font-family:inherit;}
.cpill.on{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CARDS */
.gc{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.gcb{padding:0 14px 14px;}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.bu{background:var(--red-lt);color:var(--red);}
.bs{background:var(--amber-lt);color:var(--amber);}
.bo{background:var(--green-lt);color:var(--green);}
.bk{background:var(--gray-lt);color:var(--muted);}
.bi{background:var(--blue-lt);color:var(--blue);}

/* SUMMARY */
.srow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.sc{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--rs);padding:12px 8px;text-align:center;box-shadow:var(--sh);}
.sn{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.sl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500;}
.sc.r .sn{color:var(--red);}
.sc.a .sn{color:var(--amber);}
.sc.g .sn{color:var(--green);}

/* PROGRESS */
.pw{height:4px;background:var(--gray-lt);border-radius:2px;margin:6px 0 2px;overflow:hidden;}
.pb{height:100%;border-radius:2px;transition:width .5s ease;}

/* TODO */
.tdi{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);margin-bottom:8px;overflow:hidden;position:relative;box-shadow:var(--sh);}
.tda{position:absolute;left:0;top:0;bottom:0;width:3px;}
.tda.urgent{background:var(--red);}
.tda.soon{background:var(--amber);}
.tda.ok{background:var(--green);}
.tda.unknown,.tda.info{background:var(--hint);}
.tda.info{background:var(--blue);}
.tdin{padding:12px 12px 12px 17px;}
.tdr1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.tdname{font-size:15px;font-weight:600;}
.tdd{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:3px;}
.tdn{font-size:11px;color:var(--hint);line-height:1.5;margin-bottom:6px;}
.tdc{font-size:11px;padding:3px 9px;background:var(--gray-lt);border-radius:20px;display:inline-block;color:var(--muted);font-weight:500;}
.mkbtn{width:100%;padding:11px;background:rgba(120,120,128,.1);border:none;border-top:0.5px solid var(--gb);font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;text-align:center;font-weight:500;}
.mkbtn:active{background:var(--gray-lt);}
.mkbtn.ready{background:var(--green-lt);color:var(--green);font-weight:600;}

/* KM BAR */
.kmb{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);}
.kmb label{font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;font-weight:500;}
.kmb input{flex:1;font-size:16px;font-weight:600;padding:6px 10px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.4);color:var(--text);font-family:inherit;-webkit-appearance:none;}
.kmb input:focus{outline:none;border-color:var(--blue);}
.kmb button{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:var(--rx);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

/* FORMS */
.fs{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.fi{width:100%;padding:12px 14px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.5);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none;}
.fi:focus{outline:none;border-color:var(--blue);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fbtn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;box-shadow:0 4px 16px rgba(10,132,255,.4);}
.fbtn:active{opacity:.85;}
textarea.fi{resize:vertical;min-height:70px;}

/* LOG */
.le{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--sh);}
.lt{font-size:15px;font-weight:600;margin-bottom:3px;}
.lm{font-size:12px;color:var(--muted);margin-bottom:7px;}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--gray-lt);color:var(--muted);font-weight:500;}

/* CONTACTS */
.ccard{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh);}
.ctype{font-size:10px;color:var(--hint);margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.cname{font-size:15px;font-weight:600;}
a.cbtn{padding:9px 16px;background:var(--blue-lt);color:var(--blue);border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;}

/* DOCS */
.dr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--gb);}
.dr:last-child{border-bottom:none;}
.dl{font-size:15px;font-weight:500;}
.de{font-size:12px;color:var(--muted);margin-top:2px;}
.dedit{padding:6px 13px;border:0.5px solid rgba(120,120,128,.3);border-radius:20px;background:var(--gray-lt);font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:500;}

/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--rx);font-size:13px;line-height:1.5;margin-bottom:8px;display:flex;gap:8px;font-weight:500;}
.alert.hybrid{background:var(--blue-lt);color:var(--blue);}
.alert.danger{background:var(--red-lt);color:var(--red);}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--hint);}
.empty .ei{font-size:44px;margin-bottom:12px;}
.empty .et{font-size:15px;line-height:1.5;}

/* OVERLAYS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ov.on{display:flex;}
.ovs{background:var(--glass-dk,rgba(28,28,30,.88));-webkit-backdrop-filter:saturate(200%) blur(40px);backdrop-filter:saturate(200%) blur(40px);border:0.5px solid var(--gb2);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;padding:16px 20px max(28px,env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
.ovh{width:36px;height:5px;background:rgba(120,120,128,.4);border-radius:3px;margin:0 auto 16px;}
.ovt{font-size:19px;font-weight:700;margin-bottom:18px;letter-spacing:-.3px;}
.cancelbtn{width:100%;padding:12px;background:transparent;border:none;color:var(--muted);font-size:15px;margin-top:6px;cursor:pointer;font-family:inherit;}

/* MISC */
.delbtn{padding:5px 11px;background:var(--red-lt);color:var(--red);border:none;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
.editbtn{padding:4px 10px;background:var(--blue-lt);color:var(--blue);border:none;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
#syncBar{position:fixed;top:max(58px,env(safe-area-inset-top));right:16px;background:var(--blue-lt);color:var(--blue);font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;z-index:300;display:none;}
</style>
</head>
<body>

<div id="syncBar">⟳ กำลัง sync...</div>

<!-- AUTH -->
<div class="aw" id="authWrap">
<div class="ac">
  <div class="a-logo">🚗</div>
  <div class="a-title">Car Care</div>
  <div class="a-sub">ระบบบำรุงรักษารถยนต์ส่วนตัว</div>

  <!-- Face ID quick login — shown only if available -->
  <div id="faceIdBtn" style="display:none;margin-bottom:16px;">
    <button class="a-btn" id="faceIdLogin" onclick="doFaceIdLogin()" style="background:linear-gradient(135deg,#1C1C1E,#3A3A3C);font-size:17px;letter-spacing:.5px;">
      Face ID / Touch ID เข้าสู่ระบบ
    </button>
    <div style="text-align:center;margin-top:10px;">
      <span onclick="showPasswordForm()" style="font-size:13px;color:var(--blue);cursor:pointer;">ใช้ password แทน</span>
    </div>
  </div>

  <div id="faceIdSaved" style="display:none;text-align:center;margin-bottom:12px;">
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">เข้าสู่ระบบในชื่อ</div>
    <div style="font-size:16px;font-weight:700;" id="faceIdName"></div>
  </div>

  <div class="a-tabs" id="authTabs">
    <div class="a-tab active" id="tabL" onclick="authTab('login')">เข้าสู่ระบบ</div>
    <div class="a-tab" id="tabS" onclick="authTab('signup')">สมัครสมาชิก</div>
  </div>
  <div id="fLogin">
    <div class="a-field"><label class="a-label">Email</label>
      <input class="a-input" type="email" id="lEmail" placeholder="email@example.com" autocomplete="email"></div>
    <div class="a-field"><label class="a-label">Password</label>
      <input class="a-input" type="password" id="lPass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="a-btn" id="lBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
  <div id="fSignup" style="display:none;">
    <div class="a-field"><label class="a-label">ชื่อผู้ใช้</label>
      <input class="a-input" type="text" id="sName" placeholder="เช่น คุณปอม หรือ ภรรยา"></div>
    <div class="a-field"><label class="a-label">Email</label>
      <input class="a-input" type="email" id="sEmail" placeholder="email@example.com" autocomplete="email"></div>
    <div class="a-field"><label class="a-label">Password</label>
      <input class="a-input" type="password" id="sPass" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password"></div>
    <button class="a-btn" id="sBtn" onclick="doSignup()">สมัครสมาชิก</button>
  </div>
  <div class="a-msg" id="authMsg"></div>
</div>
</div>

<!-- APP -->
<div class="app" id="App">
<div class="hdr">
  <div class="hdr-row">
    <div><div class="hdr-title">🚗 Car Care</div><div class="hdr-sub" id="hSub">ระบบบำรุงรักษารถยนต์</div></div>
    <button class="ubadge" id="uBadge" onclick="doLogout()">ออก</button>
  </div>
  <div class="cpills" id="cPills" style="display:none;"></div>
</div>
<div class="main" id="mainC"></div>
<div class="tabs">
  <button class="ti on" onclick="goTab('dashboard')" id="tab-dashboard"><div class="tiw"><span class="tic">🏠</span></div><span class="til">ภาพรวม</span></button>
  <button class="ti" onclick="goTab('todo')" id="tab-todo"><div class="tiw"><span class="tic">🔧</span></div><span class="til">To-Do</span></button>
  <button class="ti" onclick="goTab('log')" id="tab-log"><div class="tiw"><span class="tic">➕</span></div><span class="til">บันทึก</span></button>
  <button class="ti" onclick="goTab('history')" id="tab-history"><div class="tiw"><span class="tic">📋</span></div><span class="til">ประวัติ</span></button>
  <button class="ti" onclick="goTab('contacts')" id="tab-contacts"><div class="tiw"><span class="tic">📞</span></div><span class="til">ฉุกเฉิน</span></button>
</div>
</div>

<!-- OVERLAY: ADD CONTACT -->
<div class="ov" id="ovContact">
<div class="ovs">
  <div class="ovh"></div><div class="ovt">เพิ่มรายชื่อ</div>
  <div class="fs"><label class="fl">ประเภท</label>
    <select class="fi" id="ctType"><option>ศูนย์บริการ</option><option>ร้านช่าง</option><option>ปั๊มน้ำมัน</option><option>ประกันภัย</option><option>อื่นๆ</option></select></div>
  <div class="fs"><label class="fl">ชื่อ</label><input class="fi" id="ctName" placeholder="ศูนย์โตโยต้า เอกมัย"></div>
  <div class="fs"><label class="fl">เบอร์โทร</label><input class="fi" id="ctPhone" type="tel"></div>
  <div class="fs"><label class="fl">หมายเหตุ</label><input class="fi" id="ctNote" placeholder="เวลาทำการ ฯลฯ"></div>
  <button class="fbtn" onclick="saveContact()">บันทึก</button>
  <button class="cancelbtn" onclick="closeOv('ovContact')">ยกเลิก</button>
</div>
</div>

<!-- OVERLAY: EDIT DOC -->
<div class="ov" id="ovDoc">
<div class="ovs">
  <div class="ovh"></div><div class="ovt" id="ovDocTitle">แก้ไขเอกสาร</div>
  <input type="hidden" id="dCarId"><input type="hidden" id="dType">
  <div class="fs"><label class="fl">วันหมดอายุ</label><input class="fi" type="date" id="dExpiry"></div>
  <div class="fs"><label class="fl">บริษัท / หมายเหตุ</label><input class="fi" id="dNote" placeholder="เช่น วิริยะประกันภัย"></div>
  <button class="fbtn" onclick="saveDoc()">บันทึก</button>
  <button class="cancelbtn" onclick="closeOv('ovDoc')">ยกเลิก</button>
</div>
</div>

<!-- OVERLAY: EDIT LOG -->
<div class="ov" id="ovEditLog">
<div class="ovs">
  <div class="ovh"></div><div class="ovt">✏️ แก้ไขรายการ</div>
  <input type="hidden" id="elId">
  <div class="fs"><label class="fl">รถ</label>
    <select class="fi" id="elCar">
      <option value="altis">Toyota Altis (ษล 3427)</option>
      <option value="estima">Toyota Estima Hybrid (ฎจ 6302)</option>
      <option value="cx5">Mazda CX-5 (3กษ 809)</option>
    </select></div>
  <div class="fr2">
    <div class="fs"><label class="fl">วันที่</label><input class="fi" type="date" id="elDate"></div>
    <div class="fs"><label class="fl">เลขไมล์</label><input class="fi" type="number" id="elKm"></div>
  </div>

// ── FACE ID / BIOMETRIC LOGIN ──
const BIOMETRIC_KEY='cc_biometric';

function isBiometricAvailable(){
  return window.PublicKeyCredential !== undefined &&
    typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function';
}

async function checkBiometricAvailable(){
  if(!isBiometricAvailable()) return false;
  try{ return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}

function showPasswordForm(){
  document.getElementById('faceIdBtn').style.display='none';
  document.getElementById('faceIdSaved').style.display='none';
  document.getElementById('authTabs').style.display='flex';
  document.getElementById('fLogin').style.display='';
}

async function initBiometricUI(){
  const saved=localStorage.getItem(BIOMETRIC_KEY);
  const available=await checkBiometricAvailable();
  if(saved && available){
    const data=JSON.parse(saved);
    document.getElementById('faceIdName').textContent='👤 '+data.name;
    document.getElementById('faceIdSaved').style.display='block';
    document.getElementById('faceIdBtn').style.display='block';
    document.getElementById('authTabs').style.display='none';
    document.getElementById('fLogin').style.display='none';
  }
}

async function doFaceIdLogin(){
  const saved=localStorage.getItem(BIOMETRIC_KEY);
  if(!saved){ authMsg('ไม่พบข้อมูล Face ID กรุณา login ด้วย password ก่อน',true); showPasswordForm(); return; }
  const data=JSON.parse(saved);
  authMsg('กำลังยืนยัน Face ID...', false);
  try{
    // Use WebAuthn to verify biometric — challenge is just a random buffer
    const challenge=new Uint8Array(32);
    crypto.getRandomValues(challenge);
    await navigator.credentials.get({
      publicKey:{
        challenge,
        timeout:60000,
        userVerification:'required',
        allowCredentials: data.credId ? [{
          id: base64ToBuffer(data.credId),
          type:'public-key',
          transports:['internal']
        }] : []
      }
    });
    // Biometric verified — restore session
    authMsg('✅ Face ID สำเร็จ กำลังเข้าสู่ระบบ...', false);
    sess={ access_token: data.token, refresh_token: data.refresh, user:{ id: data.uid, email: data.email, user_metadata:{ display_name: data.name } } };
    uName = data.name;
    // Verify token still valid
    const r=await api('/auth/v1/user','GET',null,data.token);
    if(r.ok && r.d.id){
      sess.user=r.d;
      localStorage.setItem('cc_sess',JSON.stringify(sess));
      await startApp();
    } else {
      authMsg('Session หมดอายุ กรุณา login ใหม่',true);
      showPasswordForm();
    }
  }catch(e){
    authMsg('Face ID ไม่สำเร็จ กรุณาลองใหม่ หรือใช้ password',true);
  }
}

async function offerBiometricSetup(){
  const available=await checkBiometricAvailable();
  if(!available) return;
  if(localStorage.getItem(BIOMETRIC_KEY)) return; // already set up
  // Ask user
  if(!confirm('ต้องการใช้ Face ID / Touch ID ในการเข้าสู่ระบบครั้งถัดไปไหม?')) return;
  try{
    const challenge=new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const uid=sess.user.id;
    const cred=await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{ name:'Car Care', id: location.hostname },
        user:{ id: new TextEncoder().encode(uid), name: sess.user.email, displayName: uName },
        pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
        authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
        timeout:60000,
        attestation:'none'
      }
    });
    const credId=bufferToBase64(cred.rawId);
    localStorage.setItem(BIOMETRIC_KEY, JSON.stringify({
      name: uName, email: sess.user.email, uid,
      token: sess.access_token, refresh: sess.refresh_token,
      credId
    }));
    alert('✅ ตั้งค่า Face ID สำเร็จ! ครั้งถัดไปกด Face ID ได้เลยครับ');
  }catch(e){
    // User cancelled or not supported — silently skip
  }
}

function bufferToBase64(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)));
}
function base64ToBuffer(base64){
  const bin=atob(base64);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}

async function doSignup(){
  const name=document.getElementById('sName').value.trim();
  const email=document.getElementById('sEmail').value.trim();
  const pass=document.getElementById('sPass').value;
  if(!name||!email||!pass){authMsg('กรุณากรอกข้อมูลให้ครบ',true);return;}
  const b=document.getElementById('sBtn');b.disabled=true;b.textContent='กำลังสมัคร...';
  const r=await api('/auth/v1/signup','POST',{email,password:pass,data:{display_name:name}});
  b.disabled=false;b.textContent='สมัครสมาชิก';
  if(r.ok&&r.d.user){
    authMsg('สมัครสำเร็จ! กรุณาตรวจสอบ email ยืนยัน แล้วเข้าสู่ระบบ',false);
    authTab('login');
  } else {
    authMsg(r.d.msg||r.d.error_description||'สมัครไม่สำเร็จ',true);
  }
}



async function doLogout(){
  if(!confirm('ออกจากระบบ?'))return;
  if(syncTimer){ clearInterval(syncTimer); syncTimer=null; }
  // Ask if they want to remove Face ID too
  if(localStorage.getItem(BIOMETRIC_KEY)){
    if(confirm('ลบ Face ID ด้วยไหม? (ถ้าไม่ลบ ครั้งหน้าก็ยังใช้ Face ID ได้)')){
      localStorage.removeItem(BIOMETRIC_KEY);
    }
  }
  if(sess)await api('/auth/v1/logout','POST',{},sess.access_token);
  sess=null;uName='';
  localStorage.removeItem('cc_sess');
  document.getElementById('App').classList.remove('on');
  document.getElementById('authWrap').style.display='flex';
  KM={altis:0,estima:0,cx5:0};LD={};LOGS=[];CONTACTS=[];DOCS={};
}

  const [rk,rd,rl,rc]=await Promise.all([

    api(`/rest/v1/car_lastdone?user_id=eq.${uid}&select=*`,'GET',null,tok),
    api(`/rest/v1/car_logs?user_id=eq.${uid}&select=*&order=created_at.desc`,'GET',null,tok),
    api(`/rest/v1/car_docs?user_id=eq.${uid}&select=*`,'GET',null,tok),
  ]);
  if(rk.ok)rk.d.forEach(r=>KM[r.car_id]=r.km);
  if(rd.ok)rd.d.forEach(r=>LD[r.item_key]=r.km);
  if(rl.ok)LOGS=rl.d.map(r=>({id:r.id,carId:r.car_id,date:r.date,km:r.km,type:r.type,place:r.place,shop:r.shop,partCost:r.part_cost,laborCost:r.labor_cost,product:r.product,note:r.note,recordedBy:r.recorded_by,photos:r.photos||'[]',ts:new Date(r.created_at).getTime()}));
  if(rc.ok)rc.d.forEach(r=>DOCS[r.doc_key]={expiry:r.expiry,note:r.note});
  CONTACTS=JSON.parse(localStorage.getItem('cc_contacts')||'[]');
  sync(false);
}

async function startApp(){

function startAutoSync(){
  // Auto refresh every 30 seconds
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(async()=>{
    await loadAll();
    render();
  }, 30000);

  // Also refresh when user comes back to the tab/app
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible' && sess){
      await loadAll();
      render();
    }
  });

  // Refresh when iPhone wakes from background (focus event)
  window.addEventListener('focus',async()=>{
    if(sess){ await loadAll(); render(); }
  });
}

// STATUS
function st(cid,item){
  if(item.n===0)return'info';
  const ck=KM[cid]||0;if(!ck)return'unknown';
  const lk=LD[`${cid}_${item.id}`]||0;
  const p=lk?((ck-lk)/item.n*100):(ck/item.n*100);
  return p>=95?'urgent':p>=75?'soon':'ok';
}
function pct(cid,item){
  if(!item.n||!KM[cid])return 0;
  const lk=LD[`${cid}_${item.id}`]||0;
  return Math.min(100,Math.round(lk?((KM[cid]-lk)/item.n*100):(KM[cid]/item.n*100)));
}
const SL={urgent:'⚠ ถึงกำหนด!',soon:'▲ ใกล้ถึง',ok:'✓ ปกติ',unknown:'? ยังไม่มีข้อมูล',info:'ℹ ไม่ต้องเปลี่ยน'};
const SB={urgent:'bu',soon:'bs',ok:'bo',unknown:'bk',info:'bi'};
const SC={urgent:'var(--red)',soon:'var(--amber)',ok:'var(--green)',unknown:'var(--hint)',info:'var(--blue)'};

      msg.textContent='⟳ กำลัง upload รูป...';
      await uploadPhotos('ql',newId);

    LOGS.unshift({id:newId,carId:cid,date,km:kv,type:itemLabel,
      place:body.place,shop:body.shop,partCost:body.part_cost,
      laborCost:body.labor_cost,product:body.product,note:body.note,

    }
    const itemId=Object.values(CARS[cid].sc).find(i=>i.l===itemLabel)?.id;
    if(itemId){

      await rpc('/rest/v1/car_lastdone','POST',{user_id:uid,item_key:key,km:kv},tok,{Prefer:'resolution=merge-duplicates'});

// ── PHOTO HANDLING ──
const photoQueues={log:[],ql:[]};

function handlePhotos(prefix,event){
  Array.from(event.target.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*MAX/w);w=MAX;}
          else{w=Math.round(w*MAX/h);h=MAX;}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.75);
        const fname=`${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
        photoQueues[prefix].push({dataUrl,name:fname});
        renderPhotoPreview(prefix);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreview(prefix){
  const el=document.getElementById(`${prefix}PhotoPreview`);
  if(!el)return;
  el.innerHTML=photoQueues[prefix].map((p,i)=>
    `<div style="position:relative;">
      <img src="${p.dataUrl}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;border:0.5px solid var(--gb);">
      <button onclick="removePhoto('${prefix}',${i})" style="position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1;">×</button>
    </div>`
  ).join('');
}

function removePhoto(prefix,i){photoQueues[prefix].splice(i,1);renderPhotoPreview(prefix);}

async function uploadPhotos(prefix,logId){
  const photos=photoQueues[prefix];
  if(!photos.length)return[];
  const tok=sess.access_token,uid=sess.user.id;
  const paths=[];
  for(const p of photos){
    const blob=await(await fetch(p.dataUrl)).blob();
    const path=`${uid}/${logId}/${p.name}`;
    const r=await fetch(`${SBURL}/storage/v1/object/car-photos/${path}`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+tok,'Content-Type':'image/jpeg','x-upsert':'true'},
      body:blob
    });
    if(r.ok)paths.push(path);
  }
  if(paths.length&&logId){
    await rpc(`/rest/v1/car_logs?id=eq.${logId}`,'PATCH',{photos:JSON.stringify(paths)},tok);
  }
  photoQueues[prefix]=[];
  return paths;
}

async function getSignedUrl(path){
  const r=await fetch(`${SBURL}/storage/v1/object/sign/car-photos/${path}`,{
    method:'POST',
    headers:{...BH,'Authorization':'Bearer '+sess.access_token},
    body:JSON.stringify({expiresIn:3600})
  });
  const d=await r.json();
  return d.signedURL?`${SBURL}/storage/v1${d.signedURL}`:null;
}

async function saveLog(){
  const cid=document.getElementById('logCar').value;
  const date=document.getElementById('logDate').value;
  const kv=parseInt(document.getElementById('logKm').value);
  const msg=document.getElementById('logMsg');
  if(!date||!kv){msg.textContent='⚠ กรุณากรอกวันที่และเลขไมล์';msg.style.color='var(--red)';return;}
  msg.textContent='⟳ กำลังบันทึก...';msg.style.color='var(--muted)';
  try{
    const uid=sess.user.id,tok=sess.access_token;
    const body={user_id:uid,recorded_by:document.getElementById('logBy').value||uName,car_id:cid,date,km:kv,
      type:document.getElementById('logType').value,place:document.getElementById('logPlace').value,
      shop:document.getElementById('logShop').value,
      part_cost:document.getElementById('logPart').value||null,
      labor_cost:document.getElementById('logLabor').value||null,
      product:document.getElementById('logProduct').value,
      note:document.getElementById('logNote').value};
    const r=await rpc('/rest/v1/car_logs','POST',body,tok,{Prefer:'return=representation'});
    if(!r.ok){const e=await r.text();msg.textContent='❌ '+e.substring(0,100);msg.style.color='var(--red)';return;}
    const data=await r.json();
    const newId=data[0]?.id;
    // Upload photos if any
    if(photoQueues.log.length){
      msg.textContent='⟳ กำลัง upload รูป...';
      await uploadPhotos('log',newId);
    }
    LOGS.unshift({id:newId,carId:cid,date,km:kv,type:body.type,place:body.place,shop:body.shop,
      partCost:body.part_cost,laborCost:body.labor_cost,product:body.product,note:body.note,
      recordedBy:body.recorded_by,ts:Date.now(),photos:'[]'});
    if(!KM[cid]||kv>KM[cid]){KM[cid]=kv;await rpc('/rest/v1/car_km','POST',{user_id:uid,car_id:cid,km:kv},tok,{Prefer:'resolution=merge-duplicates'});}
    msg.textContent='✅ บันทึกเรียบร้อย!';msg.style.color='var(--green)';
    setTimeout(()=>rLog(document.getElementById('mainC')),1400);
  }catch(e){msg.textContent='❌ '+e.message;msg.style.color='var(--red)';}
}

// INIT — also handles redirect from password reset email
async function init(){
  // Show Face ID button if previously set up
  await initBiometricUI();
  // 1. Check URL hash for access_token (from Supabase password reset email)
  const hash = window.location.hash;
  if(hash && hash.includes('access_token')){
    const params = new URLSearchParams(hash.replace('#',''));
    const tok = params.get('access_token');
    const refresh = params.get('refresh_token');
    if(tok){
      const r = await api('/auth/v1/user','GET',null,tok);
      if(r.ok && r.d.id){
        sess = { access_token: tok, refresh_token: refresh, user: r.d };
        uName = r.d.user_metadata?.display_name || r.d.email.split('@')[0];
        localStorage.setItem('cc_sess', JSON.stringify(sess));
        // clean URL
        history.replaceState(null,'',window.location.pathname);
        // if this was a password reset, show a set-new-password prompt
        if(params.get('type')==='recovery'){
          showSetPassword(tok);
          return;
        }
        await startApp();
        return;
      }
    }
  }

  // 2. Check stored session
  const stored = localStorage.getItem('cc_sess');
  if(stored){
    try{
      const s = JSON.parse(stored);
      const r = await api('/auth/v1/user','GET',null,s.access_token);
      if(r.ok && r.d.id){
        sess=s; sess.user=r.d;
        uName = r.d.user_metadata?.display_name || r.d.email.split('@')[0];
        await startApp(); return;
      }
    }catch(e){}
    localStorage.removeItem('cc_sess');
  }
}

async function doSetPassword(tok){
  const p1=document.getElementById('newPass1').value;
  const p2=document.getElementById('newPass2').value;
  if(!p1||p1.length<6){authMsg('Password ต้องมีอย่างน้อย 6 ตัวอักษร',true);return;}
  if(p1!==p2){authMsg('Password ไม่ตรงกัน',true);return;}
  const r=await fetch(SBURL+'/auth/v1/user',{
    method:'PUT',
    headers:{...BH,'Authorization':'Bearer '+tok},
    body:JSON.stringify({password:p1})
  });
  const d=await r.json();
  if(r.ok){
    authMsg('✅ ตั้ง Password สำเร็จ! กำลังเข้าสู่ระบบ...',false);
    setTimeout(async()=>{
      const r2=await api('/auth/v1/user','GET',null,tok);
      if(r2.ok&&r2.d.id){
        sess={access_token:tok,user:r2.d};
        uName=r2.d.user_metadata?.display_name||r2.d.email.split('@')[0];
        localStorage.setItem('cc_sess',JSON.stringify(sess));
        await startApp();
      }
    },1000);
  } else {
    authMsg(d.msg||d.error_description||'เกิดข้อผิดพลาด',true);
  }
}

// Improve login error visibility
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  if(!email||!pass){authMsg('กรุณากรอก email และ password',true);return;}
  const b=document.getElementById('lBtn');b.disabled=true;b.textContent='กำลังเข้าสู่ระบบ...';
  try{
    const r=await api('/auth/v1/token?grant_type=password','POST',{email,password:pass});
    b.disabled=false;b.textContent='เข้าสู่ระบบ';
    if(r.ok&&r.d.access_token){
      sess=r.d;
      uName=r.d.user?.user_metadata?.display_name||email.split('@')[0];
      localStorage.setItem('cc_sess',JSON.stringify(sess));
      await startApp();
    } else {
      const msg=r.d.error_description||r.d.msg||r.d.error||JSON.stringify(r.d);
      authMsg('❌ '+msg,true);
    }
  }catch(e){
    b.disabled=false;b.textContent='เข้าสู่ระบบ';
    authMsg('❌ เชื่อมต่อไม่ได้: '+e.message,true);
  }
}

init();
</script>
