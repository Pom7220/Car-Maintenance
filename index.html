<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Car Care">
<meta name="theme-color" content="#1C1C1E">
<title>Car Care</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0A84FF;--blue-lt:rgba(10,132,255,.15);
  --green:#30D158;--green-lt:rgba(48,209,88,.15);
  --amber:#FF9F0A;--amber-lt:rgba(255,159,10,.15);
  --red:#FF453A;--red-lt:rgba(255,69,58,.15);
  --gray-lt:rgba(120,120,128,.12);
  --glass:rgba(255,255,255,.72);
  --gb:rgba(255,255,255,.45);--gb2:rgba(255,255,255,.1);
  --blur:saturate(180%) blur(20px);
  --bg:linear-gradient(160deg,#E8F4FF 0%,#F0EBF8 50%,#E6F7F0 100%);
  --text:#1C1C1E;--muted:#636366;--hint:#AEAEB2;
  --r:16px;--rs:12px;--rx:10px;--sh:0 2px 8px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){:root{
  --glass:rgba(44,44,46,.82);--gb:rgba(255,255,255,.1);
  --bg:linear-gradient(160deg,#0D1B2A 0%,#1A0D2E 50%,#0A1F17 100%);
  --text:#F2F2F7;--muted:#AEAEB2;--hint:#636366;
  --blue-lt:rgba(10,132,255,.2);--green-lt:rgba(48,209,88,.2);
  --amber-lt:rgba(255,159,10,.2);--red-lt:rgba(255,69,58,.2);--gray-lt:rgba(120,120,128,.18);
}}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;}

/* AUTH */
.aw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.ac{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:24px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.12);}
.a-logo{font-size:48px;text-align:center;margin-bottom:6px;}
.a-title{font-size:26px;font-weight:700;text-align:center;letter-spacing:-.5px;margin-bottom:4px;}
.a-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;}
.a-tabs{display:flex;background:var(--gray-lt);border-radius:var(--rx);padding:3px;margin-bottom:20px;}
.a-tab{flex:1;padding:8px;text-align:center;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .2s;}
.a-tab.on{background:var(--glass);color:var(--text);box-shadow:var(--sh);}
.af{margin-bottom:14px;}
.al{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:block;}
.ai{width:100%;padding:13px 14px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.5);color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none;}
.ai:focus{outline:none;border-color:var(--blue);}
.abtn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:var(--rx);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;box-shadow:0 4px 16px rgba(10,132,255,.4);}
.abtn:active{opacity:.85;}
.abtn:disabled{opacity:.5;cursor:not-allowed;}
.amsg{font-size:13px;text-align:center;margin-top:10px;min-height:18px;padding:0 4px;line-height:1.4;}
.amsg.err{color:var(--red);}
.amsg.ok{color:var(--green);}

/* APP LAYOUT */
.app{display:none;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;}
.app.on{display:flex;}
.hdr{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:0.5px solid var(--gb);padding:max(52px,env(safe-area-inset-top)) 20px 10px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;}
.hdr-title{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1;}
.hdr-sub{font-size:13px;color:var(--muted);}
.ubadge{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--blue-lt);color:var(--blue);cursor:pointer;white-space:nowrap;border:none;font-family:inherit;}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 110px;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:0.5px solid var(--gb);display:flex;padding:10px 8px max(24px,env(safe-area-inset-bottom));z-index:100;gap:4px;}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;cursor:pointer;border:none;background:none;color:var(--hint);transition:all .2s cubic-bezier(.34,1.56,.64,1);border-radius:var(--rx);}
.ti.on{color:var(--blue);}
.ti.on .tiw{background:var(--blue-lt);transform:scale(1.08);}
.tiw{width:44px;height:28px;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);border-radius:var(--rx);}
.tic{font-size:20px;line-height:1;}
.til{font-size:10px;font-weight:500;}

/* CAR PILLS */
.cpills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.cpills::-webkit-scrollbar{display:none;}
.cpill{padding:6px 14px;border-radius:20px;border:0.5px solid var(--gb);background:rgba(255,255,255,.3);font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0;font-family:inherit;}
.cpill.on{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CARDS */
.gc{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.gcb{padding:0 14px 14px;}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.bu{background:var(--red-lt);color:var(--red);}
.bs{background:var(--amber-lt);color:var(--amber);}
.bo{background:var(--green-lt);color:var(--green);}
.bk{background:var(--gray-lt);color:var(--muted);}
.bi{background:var(--blue-lt);color:var(--blue);}

/* SUMMARY ROW */
.srow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.sc{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--rs);padding:12px 8px;text-align:center;box-shadow:var(--sh);}
.sn{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.sl{font-size:10px;color:var(--muted);margin-top:2px;font-weight:500;}
.sc.r .sn{color:var(--red);}
.sc.a .sn{color:var(--amber);}
.sc.g .sn{color:var(--green);}

/* PROGRESS */
.pw{height:4px;background:var(--gray-lt);border-radius:2px;margin:6px 0 2px;overflow:hidden;}
.pb{height:100%;border-radius:2px;transition:width .5s ease;}

/* TODO ITEMS */
.tdi{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);margin-bottom:8px;overflow:hidden;position:relative;box-shadow:var(--sh);}
.tda{position:absolute;left:0;top:0;bottom:0;width:3px;}
.tda.urgent{background:var(--red);}
.tda.soon{background:var(--amber);}
.tda.ok{background:var(--green);}
.tda.unknown{background:var(--hint);}
.tda.info{background:var(--blue);}
.tdin{padding:12px 12px 12px 17px;}
.tdr1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.tdname{font-size:15px;font-weight:600;}
.tdd{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:2px;}
.tdn{font-size:11px;color:var(--hint);line-height:1.5;margin-bottom:4px;}
.tdc{font-size:11px;padding:3px 9px;background:var(--gray-lt);border-radius:20px;display:inline-block;color:var(--muted);font-weight:500;}

/* KM BAR */
.kmb{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);}
.kmb label{font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;font-weight:500;}
.kmb input{flex:1;font-size:16px;font-weight:600;padding:6px 10px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.4);color:var(--text);font-family:inherit;-webkit-appearance:none;}
.kmb input:focus{outline:none;border-color:var(--blue);}
.kmb button{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:var(--rx);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

/* FORMS */
.fs{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.fi{width:100%;padding:12px 14px;border:0.5px solid rgba(120,120,128,.3);border-radius:var(--rx);background:rgba(255,255,255,.5);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none;}
.fi:focus{outline:none;border-color:var(--blue);}
textarea.fi{resize:vertical;line-height:1.6;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fbtn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;box-shadow:0 4px 16px rgba(10,132,255,.4);}
.fbtn:active{opacity:.85;}
.fbtn:disabled{opacity:.5;cursor:not-allowed;}

/* LOG ENTRIES */
.le{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;box-shadow:var(--sh);}
.lt{font-size:15px;font-weight:600;margin-bottom:3px;}
.lm{font-size:12px;color:var(--muted);margin-bottom:7px;}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--gray-lt);color:var(--muted);font-weight:500;}

/* CONTACTS */
.ccard{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0.5px solid var(--gb);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh);}
.ctype{font-size:10px;color:var(--hint);margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.cname{font-size:15px;font-weight:600;}
a.cbtn{padding:9px 16px;background:var(--blue-lt);color:var(--blue);border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;}

/* DOCS */
.dr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--gb);}
.dr:last-child{border-bottom:none;}
.dl{font-size:15px;font-weight:500;}
.de{font-size:12px;color:var(--muted);margin-top:2px;}
.dedit{padding:6px 13px;border:0.5px solid rgba(120,120,128,.3);border-radius:20px;background:var(--gray-lt);font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:500;}

/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--rx);font-size:13px;line-height:1.5;margin-bottom:8px;display:flex;gap:8px;font-weight:500;}
.alert.hybrid{background:var(--blue-lt);color:var(--blue);}
.alert.danger{background:var(--red-lt);color:var(--red);}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--hint);}
.ei{font-size:44px;margin-bottom:12px;}
.et{font-size:15px;line-height:1.5;}

/* OVERLAYS */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ov.on{display:flex;}
.ovs{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;padding:16px 20px max(28px,env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
.ovh{width:36px;height:5px;background:rgba(120,120,128,.4);border-radius:3px;margin:0 auto 16px;}
.ovt{font-size:19px;font-weight:700;margin-bottom:18px;letter-spacing:-.3px;}
.cancelbtn{width:100%;padding:12px;background:transparent;border:none;color:var(--muted);font-size:15px;margin-top:6px;cursor:pointer;font-family:inherit;}

/* MISC */
.delbtn{padding:5px 11px;background:var(--red-lt);color:var(--red);border:none;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
.editbtn{padding:4px 10px;background:var(--blue-lt);color:var(--blue);border:none;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
#syncBar{position:fixed;top:max(58px,env(safe-area-inset-top));right:16px;background:var(--blue-lt);color:var(--blue);font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;z-index:300;display:none;}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:var(--glass);border:1.5px dashed var(--gb);border-radius:var(--rx);cursor:pointer;font-size:14px;color:var(--muted);font-weight:500;width:100%;}
</style>
</head>
<body>
<div id="syncBar">⟳ กำลัง sync...</div>

<!-- AUTH -->
<div class="aw" id="authWrap">
<div class="ac">
  <div class="a-logo">🚗</div>
  <div class="a-title">Car Care</div>
  <div class="a-sub">ระบบบำรุงรักษารถยนต์</div>
  <div id="faceIdSection" style="display:none;margin-bottom:16px;">
    <button class="abtn" onclick="doFaceIdLogin()" style="background:linear-gradient(135deg,#1C1C1E,#3A3A3C);font-size:17px;">
      Face ID / Touch ID เข้าสู่ระบบ
    </button>
    <div id="faceIdName" style="text-align:center;font-size:14px;font-weight:600;margin-top:8px;"></div>
    <div style="text-align:center;margin-top:8px;">
      <span onclick="showPwdForm()" style="font-size:13px;color:var(--blue);cursor:pointer;">ใช้ password แทน</span>
    </div>
  </div>
  <div id="authForms">
    <div class="a-tabs">
      <div class="a-tab on" id="tabL" onclick="authTab('login')">เข้าสู่ระบบ</div>
      <div class="a-tab" id="tabS" onclick="authTab('signup')">สมัครสมาชิก</div>
    </div>
    <div id="fLogin">
      <div class="af"><label class="al">Email</label>
        <input class="ai" type="email" id="lEmail" placeholder="email@example.com" autocomplete="email"></div>
      <div class="af"><label class="al">Password</label>
        <input class="ai" type="password" id="lPass" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="abtn" id="lBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>
    <div id="fSignup" style="display:none;">
      <div class="af"><label class="al">ชื่อแสดง</label>
        <input class="ai" type="text" id="sName" placeholder="เช่น คุณปอม หรือ ภรรยา"></div>
      <div class="af"><label class="al">Email</label>
        <input class="ai" type="email" id="sEmail" placeholder="email@example.com" autocomplete="email"></div>
      <div class="af"><label class="al">Password</label>
        <input class="ai" type="password" id="sPass" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password"></div>
      <button class="abtn" id="sBtn" onclick="doSignup()">สมัครสมาชิก</button>
    </div>
  </div>
  <div class="amsg" id="authMsg"></div>
</div>
</div>

<!-- APP -->
<div class="app" id="App">
  <div class="hdr">
    <div class="hdr-row">
      <div><div class="hdr-title">🚗 Car Care</div><div class="hdr-sub" id="hSub">ระบบบำรุงรักษารถยนต์</div></div>
      <button class="ubadge" id="uBadge" onclick="goTab('settings')">⚙️ ตั้งค่า</button>
    </div>
    <div class="cpills" id="cPills" style="display:none;"></div>
  </div>
  <div class="main" id="mainC"></div>
  <div class="tabbar">
    <button class="ti on" onclick="goTab('dashboard')" id="tab-dashboard"><div class="tiw"><span class="tic">🏠</span></div><span class="til">ภาพรวม</span></button>
    <button class="ti" onclick="goTab('todo')" id="tab-todo"><div class="tiw"><span class="tic">🔧</span></div><span class="til">To-Do</span></button>
    <button class="ti" onclick="goTab('log')" id="tab-log"><div class="tiw"><span class="tic">➕</span></div><span class="til">บันทึก</span></button>
    <button class="ti" onclick="goTab('history')" id="tab-history"><div class="tiw"><span class="tic">📋</span></div><span class="til">ประวัติ</span></button>
    <button class="ti" onclick="goTab('settings')" id="tab-settings"><div class="tiw"><span class="tic">⚙️</span></div><span class="til">ตั้งค่า</span></button>
  </div>
</div>

<!-- OVERLAY: CONTACT -->
<div class="ov" id="ovContact">
<div class="ovs">
  <div class="ovh"></div><div class="ovt">เพิ่มรายชื่อ</div>
  <div class="fs"><label class="fl">ประเภท</label>
    <select class="fi" id="ctType"><option>ศูนย์บริการ</option><option>ร้านช่าง</option><option>ปั๊มน้ำมัน</option><option>ประกันภัย</option><option>อื่นๆ</option></select></div>
  <div class="fs"><label class="fl">ชื่อ</label><input class="fi" id="ctName" placeholder="ศูนย์โตโยต้า เอกมัย"></div>
  <div class="fs"><label class="fl">เบอร์โทร</label><input class="fi" id="ctPhone" type="tel"></div>
  <div class="fs"><label class="fl">หมายเหตุ</label><input class="fi" id="ctNote" placeholder="เวลาทำการ ฯลฯ"></div>
  <button class="fbtn" onclick="saveContact()">บันทึก</button>
  <button class="cancelbtn" onclick="closeOv('ovContact')">ยกเลิก</button>
</div>
</div>

<!-- OVERLAY: EDIT DOC -->
<div class="ov" id="ovDoc">
<div class="ovs">
  <div class="ovh"></div><div class="ovt" id="ovDocTitle">แก้ไขเอกสาร</div>
  <input type="hidden" id="dCarId"><input type="hidden" id="dType">
  <div class="fs"><label class="fl">วันหมดอายุ</label><input class="fi" type="date" id="dExpiry"></div>
  <div class="fs"><label class="fl">บริษัท / หมายเหตุ</label><input class="fi" id="dNote" placeholder="เช่น วิริยะประกันภัย"></div>
  <button class="fbtn" onclick="saveDoc()">บันทึก</button>
  <button class="cancelbtn" onclick="closeOv('ovDoc')">ยกเลิก</button>
</div>
</div>

<!-- OVERLAY: EDIT LOG -->
<div class="ov" id="ovEditLog">
<div class="ovs">
  <div class="ovh"></div><div class="ovt">✏️ แก้ไขรายการ</div>
  <input type="hidden" id="elId">
  <div class="fs"><label class="fl">รถ</label>
    <select class="fi" id="elCar">
      <option value="altis">Toyota Altis (ษล 3427)</option>
      <option value="estima">Toyota Estima Hybrid (ฎจ 6302)</option>
      <option value="cx5">Mazda CX-5 (3กษ 809)</option>
    </select></div>
  <div class="fr2">
    <div class="fs"><label class="fl">วันที่</label><input class="fi" type="date" id="elDate"></div>
    <div class="fs"><label class="fl">เลขไมล์</label><input class="fi" type="number" id="elKm"></div>
  </div>
  <div class="fs"><label class="fl">ประเภทงาน</label>
    <select class="fi" id="elType">
      <option>เปลี่ยนถ่ายน้ำมันเครื่อง</option><option>เปลี่ยนไส้กรองน้ำมันเครื่อง</option>
      <option>เปลี่ยนสายพาน/โซ่</option><option>น้ำมันเกียร์</option><option>น้ำมันเบรก</option>
      <option>เปลี่ยนยาง</option><option>ตั้งศูนย์ถ่วงล้อ</option><option>เบรก (ผ้า/จาน)</option>

async function refreshToken(){
  if(!sess?.refresh_token)return false;
  try{
    const r=await fetch(SBURL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:BH,
      body:JSON.stringify({refresh_token:sess.refresh_token})
    });
    const d=await r.json();
    if(r.ok&&d.access_token){
      sess.access_token=d.access_token;
      sess.refresh_token=d.refresh_token||sess.refresh_token;
      localStorage.setItem('cc_sess',JSON.stringify(sess));
      return true;
    }
  }catch(e){}
  return false;
}

async function sbFetch(path,method,body,tok){
  const h={...BH,Authorization:'Bearer '+(tok||sess?.access_token||SBKEY)};
  const r=await fetch(SBURL+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):null});
  // Auto-refresh on 401 JWT expired
  if(r.status===401&&sess?.refresh_token){
    const ok=await refreshToken();
    if(ok){
      const h2={...BH,Authorization:'Bearer '+sess.access_token};
      const r2=await fetch(SBURL+path,{method:method||'GET',headers:h2,body:body?JSON.stringify(body):null});
      const t2=await r2.text();
      try{return{ok:r2.ok,d:JSON.parse(t2),s:r2.status};}catch{return{ok:r2.ok,d:t2,s:r2.status};}
    }
  }
  const t=await r.text();
  try{return{ok:r.ok,d:JSON.parse(t),s:r.status};}catch{return{ok:r.ok,d:t,s:r.status};}
}

async function sbPost(path,body,tok,extra){
  const token=tok||sess?.access_token||SBKEY;
  const h={...BH,Authorization:'Bearer '+token,...(extra||{})};
  const r=await fetch(SBURL+path,{method:'POST',headers:h,body:body?JSON.stringify(body):null});
  // Auto-refresh on 401
  if(r.status===401&&sess?.refresh_token){
    const ok=await refreshToken();
    if(ok){
      const h2={...BH,Authorization:'Bearer '+sess.access_token,...(extra||{})};
      return fetch(SBURL+path,{method:'POST',headers:h2,body:body?JSON.stringify(body):null});
    }
  }
  return r;
}

async function sbPatch(path,body,tok){
  const token=tok||sess?.access_token||SBKEY;
  const h={...BH,Authorization:'Bearer '+token};
  const r=await fetch(SBURL+path,{method:'PATCH',headers:h,body:JSON.stringify(body)});
  if(r.status===401&&sess?.refresh_token){
    const ok=await refreshToken();
    if(ok) return fetch(SBURL+path,{method:'PATCH',headers:{...BH,Authorization:'Bearer '+sess.access_token},body:JSON.stringify(body)});
  }
  return r;
}
async function sbDelete(path,tok){
  const token=tok||sess?.access_token||SBKEY;
  const h={...BH,Authorization:'Bearer '+token};
  const r=await fetch(SBURL+path,{method:'DELETE',headers:h});
  if(r.status===401&&sess?.refresh_token){
    const ok=await refreshToken();
    if(ok) return fetch(SBURL+path,{method:'DELETE',headers:{...BH,Authorization:'Bearer '+sess.access_token}});
  }
  return r;
}

// ══ FACE ID ══
async function offerFaceId(){
  if(localStorage.getItem(BIOMETRIC_KEY))return;
  try{
    const avail=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!avail)return;
    if(!confirm('ต้องการใช้ Face ID / Touch ID ในการเข้าสู่ระบบครั้งถัดไปไหม?'))return;
    const challenge=new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const cred=await navigator.credentials.create({publicKey:{
      challenge,
      rp:{name:'Car Care',id:location.hostname},
      user:{id:new TextEncoder().encode(sess.user.id),name:sess.user.email,displayName:uName},
      pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000,attestation:'none'
    }});
    const credId=btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
    localStorage.setItem(BIOMETRIC_KEY,JSON.stringify({
      name:uName,email:sess.user.email,uid:sess.user.id,
      token:sess.access_token,refresh:sess.refresh_token,credId
    }));
    alert('✅ ตั้งค่า Face ID สำเร็จ!');
  }catch(e){}
}

async function doFaceIdLogin(){
  const saved=JSON.parse(localStorage.getItem(BIOMETRIC_KEY)||'null');
  if(!saved){showPwdForm();return;}
  authMsg('กำลังยืนยัน Face ID...',false);
  try{
    const challenge=new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const bin=atob(saved.credId);
    const buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    await navigator.credentials.get({publicKey:{
      challenge,timeout:60000,userVerification:'required',
      allowCredentials:[{id:buf.buffer,type:'public-key',transports:['internal']}]
    }});
    authMsg('✅ Face ID สำเร็จ!',false);
    const r=await sbFetch('/auth/v1/user','GET',null,saved.token);
    if(r.ok&&r.d.id){
      sess={access_token:saved.token,refresh_token:saved.refresh,user:r.d};
      uName=saved.name;
      localStorage.setItem('cc_sess',JSON.stringify(sess));
      await startApp();
    } else {
      authMsg('Session หมดอายุ กรุณา login ด้วย password',true);
      localStorage.removeItem(BIOMETRIC_KEY);
      showPwdForm();

  }catch(e){
    authMsg('Face ID ไม่สำเร็จ กรุณาใช้ password แทน',true);
  }
}

// ══ DATA LOADING ══
async function loadAll(){
  syncBar(true);
  const tok=sess.access_token,uid=sess.user.id;
  const [rk,rd,rl,rc]=await Promise.all([
    sbFetch(`/rest/v1/car_km?user_id=eq.${uid}&select=*`,'GET',null,tok),
    sbFetch(`/rest/v1/car_lastdone?user_id=eq.${uid}&select=*`,'GET',null,tok),
    sbFetch(`/rest/v1/car_logs?user_id=eq.${uid}&select=*&order=created_at.desc`,'GET',null,tok),
    sbFetch(`/rest/v1/car_docs?user_id=eq.${uid}&select=*`,'GET',null,tok),
  ]);
  if(rk.ok)rk.d.forEach(r=>KM[r.car_id]=r.km);
  if(rd.ok)rd.d.forEach(r=>LD[r.item_key]=r.km);
  if(rl.ok)LOGS=rl.d.map(r=>({
    id:r.id,carId:r.car_id,date:r.date,km:r.km,type:r.type,
    place:r.place,shop:r.shop,partCost:r.part_cost,laborCost:r.labor_cost,
    product:r.product,note:r.note,recordedBy:r.recorded_by,
    photos:r.photos||'[]',ts:new Date(r.created_at).getTime()
  }));
  if(rc.ok)rc.d.forEach(r=>DOCS[r.doc_key]={expiry:r.expiry,note:r.note});
  CONTACTS=JSON.parse(localStorage.getItem('cc_contacts')||'[]');
  syncBar(false);
}

async function upsert(table,body,tok){
  return sbPost(`/rest/v1/${table}`,body,tok,{Prefer:'resolution=merge-duplicates'});
}

// ══ APP START ══
async function startApp(){
  document.getElementById('authWrap').style.display='none';
  document.getElementById('App').classList.add('on');
  document.getElementById('uBadge').textContent='⚙️ '+uName;
  await loadAll();
  render();
  // Auto-sync every 30s — also auto-refresh token — never re-render log tab
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(async()=>{
    if(curTab==='log')return;
    // Proactively refresh token if expires within 10 min
    if(sess?.access_token){
      try{
        const payload=JSON.parse(atob(sess.access_token.split('.')[1]));
        const expiresIn=payload.exp*1000-Date.now();
        if(expiresIn<600000) await refreshToken(); // refresh if < 10 min left
      }catch(e){}
    }
    await loadAll();render();
  },30000);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'&&sess&&curTab!=='log'){
      await loadAll();render();
    }
  });
  setTimeout(()=>offerFaceId(),2000);
}

// ══ STATUS ══
function st(cid,item){
  if(item.n===0)return 'info';
  const ck=KM[cid]||0;
  if(!ck)return 'unknown';
  const lk=LD[`${cid}_${item.id}`]||0;
  const p=lk?((ck-lk)/item.n*100):(ck/item.n*100);
  return p>=95?'urgent':p>=75?'soon':'ok';
}
function pct(cid,item){
  if(!item.n||!KM[cid])return 0;
  const lk=LD[`${cid}_${item.id}`]||0;
  return Math.min(100,Math.round(lk?((KM[cid]-lk)/item.n*100):(KM[cid]/item.n*100)));
}
const SL={urgent:'⚠ ถึงกำหนด!',soon:'▲ ใกล้ถึง',ok:'✓ ปกติ',unknown:'? ยังไม่มีข้อมูล',info:'ℹ ไม่ต้องเปลี่ยน'};
const SB={urgent:'bu',soon:'bs',ok:'bo',unknown:'bk',info:'bi'};
const SC={urgent:'var(--red)',soon:'var(--amber)',ok:'var(--green)',unknown:'var(--hint)',info:'var(--blue)'};

// ══ NAVIGATION ══
function goTab(t){
  if(t!=='log')logFormReady=false;
  curTab=t;
  document.querySelectorAll('.ti').forEach(b=>b.classList.remove('on'));
  const tb=document.getElementById('tab-'+t);
  if(tb)tb.classList.add('on');
  render();
}
function goCar(id){
  curCar=id;
  document.querySelectorAll('.cpill').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll(`.cpill[data-c="${id}"]`).forEach(p=>p.classList.add('on'));
  if(curTab==='log'){
    // Only update car selector, don't rebuild form
    const sel=document.getElementById('logCar');
    if(sel)sel.value=id;
    renderHdr();
    return;
  }
  render();
}
function renderHdr(){
  const pills=document.getElementById('cPills'),sub=document.getElementById('hSub');
  const noPills=['dashboard','settings'];
  if(noPills.includes(curTab)){
    pills.style.display='none';
    sub.textContent=curTab==='settings'?'ตั้งค่า & ข้อมูล':'ระบบบำรุงรักษารถยนต์';
  } else {
    pills.style.display='flex';
    pills.innerHTML=Object.values(CARS).map(c=>`<button class="cpill${c.id===curCar?' on':''}" data-c="${c.id}" onclick="goCar('${c.id}')">${c.name.replace('Toyota ','').replace('Mazda ','')}</button>`).join('');
    sub.textContent={todo:'To-Do รายการซ่อม',log:'บันทึกการซ่อม',history:'ประวัติ & เอกสาร'}[curTab]||'';
  }
}
function render(){
  renderHdr();
  const el=document.getElementById('mainC');
  if(curTab==='dashboard')rDash(el);
  else if(curTab==='todo')rTodo(el);
  else if(curTab==='log'){
    if(!logFormReady){rLog(el);logFormReady=true;}
    // else: preserve existing form — don't rebuild
  }
  else if(curTab==='history')rHist(el);
  else if(curTab==='settings')rSettings(el);
}

// ══ DASHBOARD ══
function rDash(el){
  const next=[];
  Object.values(CARS).forEach(car=>{
    car.sc.filter(i=>i.n>0).map(i=>({i,s:st(car.id,i),car}))
    .filter(x=>x.s!=='ok')
    .sort((a,b)=>({urgent:0,soon:1,unknown:2}[a.s]-{urgent:0,soon:1,unknown:2}[b.s]))

  await upsert('car_km',{user_id:sess.user.id,car_id:curCar,km:v},sess.access_token);
  syncBar(false);render();
}

}

  if(url)el.innerHTML=`<img src="${url}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="window.open('${url}','_blank')">`;

async function saveLog(){

  msg.textContent='⟳ กำลังบันทึก...';msg.style.color='var(--muted)';
  if(btn)btn.disabled=true;
  try{
    const uid=sess.user.id,tok=sess.access_token;
    const body={user_id:uid,recorded_by:document.getElementById('logBy').value||uName,
      car_id:cid,date,km:kv,

      place:document.getElementById('logPlace').value,

      labor_cost:document.getElementById('logLabor').value||null,
      product:document.getElementById('logProduct').value,
      note:document.getElementById('logNote').value};
    const r=await sbPost('/rest/v1/car_logs',body,tok,{Prefer:'return=representation'});
    if(!r.ok){const e=await r.text();msg.textContent='❌ '+e.substring(0,100);msg.style.color='var(--red)';if(btn)btn.disabled=false;return;}
    const data=await r.json();
    const newId=data[0]?.id;
    if(photoQ.log.length){msg.textContent='⟳ กำลัง upload รูป...';await uploadPhotos('log',newId);}
    LOGS.unshift({id:newId,carId:cid,date,km:kv,type:body.type,place:body.place,shop:body.shop,
      partCost:body.part_cost,laborCost:body.labor_cost,product:body.product,note:body.note,
      recordedBy:body.recorded_by,ts:Date.now(),photos:'[]'});
    if(!KM[cid]||kv>KM[cid]){
      KM[cid]=kv;
      await upsert('car_km',{user_id:uid,car_id:cid,km:kv},tok);
    }
    msg.textContent='✅ บันทึกเรียบร้อย!';msg.style.color='var(--green)';
    // Clear only input fields — keep car/type/place/byName as-is
    setTimeout(()=>{
      ['logKm','logShop','logPart','logLabor'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
      ['logProduct','logNote'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
      document.getElementById('logDate').value=new Date().toISOString().split('T')[0];
      photoQ.log=[];
      const pp=document.getElementById('logPhotoPreview');if(pp)pp.innerHTML='';
      const pi=document.getElementById('logPhotoInput');if(pi)pi.value='';
      msg.textContent='';
      if(btn)btn.disabled=false;
    },1200);
  }catch(e){
    msg.textContent='❌ '+e.message;msg.style.color='var(--red)';

}

// ══ PHOTOS ══
function handlePhotos(prefix,event){
  Array.from(event.target.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        photoQ[prefix].push({dataUrl:canvas.toDataURL('image/jpeg',.75),name:`${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`});
        renderPhotoPreview(prefix);
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}
function renderPhotoPreview(prefix){
  const el=document.getElementById(`${prefix}PhotoPreview`);if(!el)return;
  el.innerHTML=photoQ[prefix].map((p,i)=>`<div style="position:relative;">
    <img src="${p.dataUrl}" style="width:72px;height:72px;object-fit:cover;border-radius:10px;border:0.5px solid var(--gb);">
    <button onclick="photoQ['${prefix}'].splice(${i},1);renderPhotoPreview('${prefix}')" style="position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1;">×</button>
  </div>`).join('');
}
async function uploadPhotos(prefix,logId){
  const tok=sess.access_token,uid=sess.user.id,paths=[];
  for(const p of photoQ[prefix]){
    const blob=await(await fetch(p.dataUrl)).blob();
    const path=`${uid}/${logId}/${p.name}`;
    const r=await fetch(`${SBURL}/storage/v1/object/car-photos/${path}`,{
      method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob
    });
    if(r.ok)paths.push(path);
  }
  if(paths.length){await sbPost(`/rest/v1/car_logs?id=eq.${logId}`,{photos:JSON.stringify(paths)},sess.access_token,{method:'PATCH'});}
  photoQ[prefix]=[];return paths;
}

  localStorage.setItem('cc_contacts',JSON.stringify(CONTACTS));
  rSettings(document.getElementById('mainC'));
}

// ══ BACKUP / RESTORE ══
async function doBackup(){
  const msg=document.getElementById('backupMsg');
  if(msg)msg.textContent='⟳ กำลังเตรียมข้อมูล...';
  try{
    const backup={version:2,exported_at:new Date().toISOString(),user_email:sess?.user?.email||'',
      data:{logs:LOGS,km:KM,lastdone:LD,docs:DOCS,contacts:CONTACTS}};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`carcare_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();URL.revokeObjectURL(url);
    if(msg){msg.textContent=`✅ Backup สำเร็จ! ${LOGS.length} รายการ`;msg.style.color='var(--green)';}
  }catch(e){if(msg){msg.textContent='❌ '+e.message;msg.style.color='var(--red)';}}
}
async function doRestore(event){
  const msg=document.getElementById('backupMsg');
  const file=event.target.files[0];if(!file)return;
  if(!confirm('Restore จะ merge ข้อมูลจากไฟล์เข้ากับข้อมูลปัจจุบัน ดำเนินการต่อไหม?'))return;
  if(msg){msg.textContent='⟳ กำลัง restore...';msg.style.color='var(--muted)';}
  try{
    const backup=JSON.parse(await file.text());
    if(!backup.data)throw new Error('ไฟล์ไม่ถูกต้อง');
    const {logs,km,lastdone,docs,contacts}=backup.data;
    const tok=sess.access_token,uid=sess.user.id;
    let restored=0;
    if(logs&&logs.length){
      const existing=new Set(LOGS.map(l=>l.id));
      for(const l of logs.filter(l=>l.id&&!existing.has(l.id))){
        const r=await sbPost('/rest/v1/car_logs',{id:l.id,user_id:uid,recorded_by:l.recordedBy||'restore',
          car_id:l.carId,date:l.date,km:l.km,type:l.type,place:l.place,shop:l.shop,
          part_cost:l.partCost,labor_cost:l.laborCost,product:l.product,note:l.note,photos:l.photos||'[]'},
          tok,{Prefer:'resolution=ignore-duplicates'});
        if(r.ok)restored++;
      }
    }
    if(km)for(const [carId,v] of Object.entries(km))if(v>0&&(!KM[carId]||v>KM[carId])){KM[carId]=v;await upsert('car_km',{user_id:uid,car_id:carId,km:v},tok);}
    if(lastdone)for(const [key,v] of Object.entries(lastdone))if(!LD[key]||v>LD[key]){LD[key]=v;await upsert('car_lastdone',{user_id:uid,item_key:key,km:v},tok);}
    if(docs)for(const [key,doc] of Object.entries(docs))if(doc.expiry&&!DOCS[key]?.expiry){DOCS[key]=doc;await upsert('car_docs',{user_id:uid,doc_key:key,expiry:doc.expiry,note:doc.note||''},tok);}
    if(contacts&&contacts.length){const en=new Set(CONTACTS.map(c=>c.name));CONTACTS=[...CONTACTS,...contacts.filter(c=>!en.has(c.name))];localStorage.setItem('cc_contacts',JSON.stringify(CONTACTS));}
    if(msg){msg.textContent=`✅ Restore สำเร็จ! นำเข้า ${restored} รายการ`;msg.style.color='var(--green)';}
    setTimeout(()=>render(),1500);
  }catch(e){if(msg){msg.textContent='❌ '+e.message;msg.style.color='var(--red)';}}
  event.target.value='';
}

// ══ OVERLAY UTILS ══
function closeOv(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('on');}));

// ══ INIT ══
async function init(){
  // Check URL hash (password reset redirect)
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.replace('#',''));
    const tok=params.get('access_token');
    if(tok){
      const r=await sbFetch('/auth/v1/user','GET',null,tok);
      if(r.ok&&r.d.id){
        sess={access_token:tok,refresh_token:params.get('refresh_token'),user:r.d};
        uName=r.d.user_metadata?.display_name||r.d.email.split('@')[0];
        localStorage.setItem('cc_sess',JSON.stringify(sess));
        history.replaceState(null,'',location.pathname);
        await startApp();return;
      }
    }
  }
  // Check stored session
  const stored=localStorage.getItem('cc_sess');
  if(stored){
    try{
      const s=JSON.parse(stored);
      const r=await sbFetch('/auth/v1/user','GET',null,s.access_token);
      if(r.ok&&r.d.id){
        sess=s;sess.user=r.d;
        uName=r.d.user_metadata?.display_name||r.d.email.split('@')[0];
        await startApp();return;
      }
    }catch(e){}
    localStorage.removeItem('cc_sess');
  }
  // Show Face ID if available
  initFaceIdUI();
}

init();
</script>
